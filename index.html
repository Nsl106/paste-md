<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8"/>
  <title>paste-md</title>
  <link rel="stylesheet" href="github-markdown.css">
  <style>
      * {
          box-sizing: border-box;
      }

      #plaintext, #output {
          padding: .5em;
          border: 0;
          margin: 0;
          color: #eeeeee;
          background: #000000;
      }

      body.invert #plaintext,
      body.invert #output {
          color: #000000;
          background: #eeeeee;
      }

      #plaintext {
          font-family: monospace;
          font-size: 1.1em;

          resize: none;
          display: block;
          width: 100%;
          height: 100%;
      }

      #plaintext-wrapper {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 2em;
          overflow: auto;
          overscroll-behavior: none;
      }

      #plaintext-wrapper.mode-view #plaintext,
      #plaintext-wrapper.mode-edit #output {
          display: none;
      }

      #plaintext-wrapper.mode-split {
          display: flex;
          overflow: hidden;
      }

      #plaintext-wrapper.mode-split #plaintext,
      #plaintext-wrapper.mode-split #output {
          flex: none;
          width: 50%;
          height: 100%;
          overflow: auto;
      }

      #plaintext-wrapper.mode-split #output {
          border-left: 1px solid #333333;
      }

      body.invert #plaintext-wrapper.mode-split #output {
          border-left-color: #aaaaaa;
      }

      #nav * {
          font-family: monospace;
          font-size: 1.1em;
      }

      #nav {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 2em;
          line-height: 2em;
          text-align: right;
          vertical-align: middle;
          background: #333333;
          color: #ffffff;
          white-space: nowrap;
      }

      body.invert #nav {
          background: #aaaaaa;
          color: #000000;
      }

      #nav .nav-left {
          float: left;
      }

      #nav a {
          display: inline-block;
          padding: 0 0.5em;
          text-decoration: none;
          color: inherit;
          cursor: pointer;
      }

      #nav a:hover {
          background: #666666;
      }

      body.invert #nav a:hover {
          background: #999999;
      }

      #nav #text-offer-value {
          border: 1px solid #999999;
          background: transparent;
          width: calc(100vw - 11em);
          text-overflow: ellipsis;
          color: inherit;
          margin-right: 5px;
      }

      #nav .nav-text-offer {
          display: none;
      }

      #nav.text-offer .nav-default {
          display: none;
      }

      #nav.text-offer .nav-text-offer {
          display: inline;
      }

      .markdown-body {
          font-family: monospace;
          min-height: 100%;
      }
  </style>
  <script src="lzma.js"></script>
  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script>
      var matches;
      var lzma = new LZMA("lzma_worker.js");

      // open links from rendered markdown in a new tab so the paste isn't navigated away from
      DOMPurify.addHook('afterSanitizeAttributes', function (node) {
          if (node.tagName === 'A' && node.hasAttribute('href')) {
              node.setAttribute('target', '_blank');
              node.setAttribute('rel', 'noopener noreferrer');
          }
      });

      document.addEventListener('DOMContentLoaded', function () {
          if (matches = /(?:^|;\s*)invert=([01])(?:;|$)/.exec(document.cookie)) {
              if (matches[1] === '1') {
                  document.body.classList.add("invert");
                  setDarkmode(false);
              }
          }

          var base64 = location.hash.substr(1);
          if (base64.length == 0) {
              setMode("edit");
              return;
          }

          if (!fetch) {
              alert("Your browser does not support this page.  Sorry! :(");
              return;
          }

          fetch("data:application/octet-stream;base64," + base64).then(r => r.blob()).then(function (blob) {
              var reader = new FileReader();
              reader.onload = function () {
                  var compressed_data = Array.from(new Uint8Array(reader.result));
                  lzma.decompress(compressed_data, function (plaintext, error) {
                      if (error) {
                          alert("Failed to decompress data: " + error);
                          setMode("edit");
                          return;
                      }

                      document.getElementById("plaintext").value = plaintext;
                      setMode("view");
                  });
              };
              reader.readAsArrayBuffer(blob);
          }).catch(function (error) {
              alert("Failed to decode data: " + error);
              setMode("edit");
          });
      });

      function compress_to_base64(callback) {
          var plaintext = document.getElementById("plaintext").value;
          lzma.compress(plaintext, 1, function (compressed, error) {
              if (error) {
                  alert("Failed to compress data: " + error);
                  return;
              }

              var reader = new FileReader();
              reader.onload = function () {
                  callback(reader.result.substr(reader.result.indexOf(",") + 1));
              };
              reader.readAsDataURL(new Blob([new Uint8Array(compressed)]));
          });
      }

      function url_generate(format) {
          compress_to_base64(function (base64) {
              var url = location.protocol + "//" + location.host + location.pathname + "#" + base64;
              var result;
              if (format === 'markdown') {
                  result = "[paste](" + url + ")";
              } else {
                  result = url;
              }
              text_offer(result);
          });
      }

      // store the paste in the address bar so a refresh or bookmark keeps it
      function save() {
          compress_to_base64(function (base64) {
              history.replaceState(null, "", "#" + base64);
          });
      }

      function text_offer(text) {
          document.getElementById("text-offer-value").value = text;
          document.getElementById("nav").classList.add("text-offer");
      }

      function text_offer_copy() {
          var input = document.getElementById("text-offer-value");
          input.select();
          document.execCommand('copy');
          text_offer_cancel();
      }

      function text_offer_cancel() {
          document.getElementById("text-offer-value").value = "";
          document.getElementById("nav").classList.remove("text-offer");
      }

      function setDarkmode(isDark) {
          let outputClasses = document.getElementById("output").classList;
          let darkmodeButton = document.getElementById("darkmodebutton");
          if (isDark) {
              outputClasses.add("dark");
              outputClasses.remove("light");
              darkmodeButton.textContent = "[light mode]";
          } else {
              outputClasses.add("light");
              outputClasses.remove("dark");
              darkmodeButton.textContent = "[dark mode]";
          }
      }

      function invert() {
          var isLight = document.body.classList.contains("invert") ? 0 : 1;
          document.cookie = "invert=" + isLight + ";max-age=63072000";
          document.body.classList[isLight ? "add" : "remove"]("invert");
          setDarkmode(!isLight);
      }

      // "view" (rendered), "edit" (textarea), or "split" (both side by side, desktop only)
      var mode = "view";
      var splitAvailable = window.matchMedia("(min-width: 800px)");

      splitAvailable.addEventListener("change", function () {
          if (!splitAvailable.matches && mode === "split") {
              setMode("edit");
          } else {
              updateModeButton();
          }
      });

      function renderPreview() {
          let inputElement = document.getElementById("plaintext");
          let outputElement = document.getElementById("output");
          outputElement.innerHTML = DOMPurify.sanitize(marked.parse(inputElement.value));
      }

      var renderQueued = false;
      function queueRenderPreview() {
          if (renderQueued) return;
          renderQueued = true;
          requestAnimationFrame(function () {
              renderQueued = false;
              renderPreview();
          });
      }

      function nextMode() {
          if (mode === "view") return "edit";
          if (mode === "edit" && splitAvailable.matches) return "split";
          return "view";
      }

      function updateModeButton() {
          document.getElementById("modebutton").textContent = "[" + nextMode() + "]";
      }

      function setMode(newMode) {
          mode = newMode;
          document.getElementById("plaintext-wrapper").className = "mode-" + mode;

          if (mode !== "edit") {
              renderPreview();
          }
          if (mode !== "view") {
              document.getElementById("plaintext").focus();
          }
          updateModeButton();
      }

      function cycleMode() {
          setMode(nextMode());
      }
  </script>
</head>
<body>
<div id="plaintext-wrapper" class="mode-view">
  <textarea id="plaintext" spellcheck="true" oninput="if (mode === 'split') queueRenderPreview()"></textarea>
  <div id="output" class="markdown-body dark"></div>
</div>
<div id="nav">
  <span class="nav-default">
    <a class="nav-left" href="https://github.com/Nsl106/paste-md" target="_blank" rel="noopener noreferrer">[github]</a>
    <a class="nav-left" id = "darkmodebutton" onclick="invert()">[light mode]</a>
    <a class="nav-left" id = "modebutton" onclick="cycleMode()">[edit]</a>
    <a onclick="save()">[save]</a>
    <a onclick="url_generate('raw')">[generate url]</a>
    <a onclick="url_generate('markdown')">[generate markdown link]</a>
  </span><span class="nav-text-offer">
  <input id="text-offer-value"/>
  <a onclick="text_offer_copy()">[copy]</a>
  <a onclick="text_offer_cancel()">[cancel]</a>
  </span>
</div>
</body>
</html>
